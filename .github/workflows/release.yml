name: Release

# Builds the signed internal-test release APK.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64  base64 of the release keystore (.jks), no line breaks
#   RELEASE_STORE_PASSWORD   keystore password
#   RELEASE_KEY_ALIAS        key alias (agentime-release)
#   RELEASE_KEY_PASSWORD     key password
#
# See docs/release-signing.md. No key material is ever written to the repo.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode override (blank = build default)'
        type: string
        required: false
        default: ''
      version_name:
        description: 'versionName override (blank = build default)'
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    runs-on: ubuntu-24.04
    env:
      AGENTIME_REQUIRE_SIGNING: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        run: |
          if [ -z "${ANDROID_HOME}" ]; then
            echo "ANDROID_HOME is not set" >&2
            exit 1
          fi
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
            echo "sdkmanager not found under ${ANDROID_HOME}/cmdline-tools" >&2
            exit 1
          fi
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not configured. See docs/release-signing.md."
            exit 1
          fi
          install -d "${RUNNER_TEMP}/signing"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/signing/release.jks"
          chmod 600 "${RUNNER_TEMP}/signing/release.jks"
          echo "AGENTIME_STORE_FILE=${RUNNER_TEMP}/signing/release.jks" >> "${GITHUB_ENV}"
          echo "keystore bytes: $(wc -c < "${RUNNER_TEMP}/signing/release.jks")"

      - name: Build release APK
        env:
          AGENTIME_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          AGENTIME_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          AGENTIME_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          ARGS="--no-daemon clean assembleRelease"
          if [ -n "${VERSION_CODE}" ]; then ARGS="${ARGS} -PappVersionCode=${VERSION_CODE}"; fi
          if [ -n "${VERSION_NAME}" ]; then ARGS="${ARGS} -PappVersionName=${VERSION_NAME}"; fi
          echo "gradle ${ARGS}"
          gradle ${ARGS}

      - name: Verify signature, ABIs and Rime assets
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*unsigned*' -print -quit)"
          if [ -z "${APK}" ]; then
            echo "::error::no release APK produced"
            exit 1
          fi
          echo "APK=${APK}"
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          AAPT2="${BUILD_TOOLS}/aapt2"
          echo "build-tools: ${BUILD_TOOLS}"

          "${APKSIGNER}" verify --verbose --print-certs "${APK}" | tee apksigner.txt

          # apksigner prints the signer certificate digest as
          # "Signer #1 certificate SHA-256 digest: ..." in the concise listing
          # and as "V2 Signer: certificate SHA-256 digest: ..." with --verbose.
          # Accept either shape, and never let a missing match abort silently.
          CERT_LINE="$(grep -i 'certificate SHA-256 digest' apksigner.txt | tail -n 1 || true)"
          echo "cert line: ${CERT_LINE}"
          EXPECTED_FP="2e9b48b24f0c42309594b90522bdbad6837cf1841866222870d1c603294aca1b"
          ACTUAL_FP="$(printf '%s' "${CERT_LINE}" | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "signer sha256: '${ACTUAL_FP}'"
          if [ "${ACTUAL_FP}" != "${EXPECTED_FP}" ]; then
            echo "::error::APK certificate SHA-256 '${ACTUAL_FP}' != expected release key '${EXPECTED_FP}'"
            exit 1
          fi

          # Both ABIs and the Rime runtime must be in the package.
          unzip -l "${APK}" | grep -E 'lib/(arm64-v8a|x86_64)/librime\.so'
          unzip -l "${APK}" | grep -E 'lib/(arm64-v8a|x86_64)/librime_jni\.so'
          unzip -l "${APK}" | grep -E 'assets/rime/'
          unzip -l "${APK}" | grep -E 'assets/licenses/'

          "${AAPT2}" dump badging "${APK}" > badging-full.txt
          sed -n '1,3p' badging-full.txt | tee badging.txt
          {
            echo "SIGNER_SHA256=${ACTUAL_FP}"
            echo "APK_SHA256=$(sha256sum "${APK}" | awk '{print $1}' | tr 'a-f' 'A-F')"
            echo "APK_NAME=$(basename "${APK}")"
          } >> "${GITHUB_ENV}"

      - name: Publish build info
        run: |
          set -euo pipefail
          cat badging.txt | sed -n '1,2p'
          echo "APK  SHA-256: ${APK_SHA256}"
          echo "APK file    : ${APK_NAME}"
          echo "Signer cert : ${SIGNER_SHA256}"
          {
            echo "## AgentIME release candidate"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| APK | \`${APK_NAME}\` |"
            echo "| APK SHA-256 | \`${APK_SHA256}\` |"
            echo "| Signer cert SHA-256 | \`${SIGNER_SHA256}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo ""
            echo '```'
            sed -n '1,3p' badging.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-ime-release-${{ github.sha }}
          retention-days: 30
          path: |
            app/build/outputs/apk/release/*.apk
            apksigner.txt
            badging.txt
